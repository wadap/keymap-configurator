name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  # Main builds stay independent; production publishes are queued below.
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FIREBASE_CLI_VERSION: '15.28.2'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --global "firebase-tools@$FIREBASE_CLI_VERSION"
      - run: npm run typecheck
      - run: npm run lint
      - run: npx oxfmt --check
      - name: Test with Firestore rules
        run: firebase emulators:exec --project demo-keymap-versions --only firestore 'npm test'
      - run: npm run build
      - name: Prepare tested Hosting artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir hosting-artifact
          cp -R dist/client hosting-artifact/public
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { hosting } = JSON.parse(readFileSync('firebase.json', 'utf8'));
          delete hosting.predeploy;
          hosting.public = 'public';
          writeFileSync('hosting-artifact/firebase.json', JSON.stringify({ hosting }, null, 2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: firebase-hosting-${{ github.sha }}
          path: hosting-artifact/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: firebase-hosting-production
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://keymap-configurator.web.app
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firebase-hosting-${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global "firebase-tools@$FIREBASE_CLI_VERSION"
      - name: Check current main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$CURRENT_MAIN" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping this deployment.'
          fi
      - name: Authenticate to Firebase
        if: steps.head.outputs.current == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: keymap-configurator
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Publish tested artifact
        if: steps.head.outputs.current == 'true'
        run: firebase deploy --only hosting --project keymap-configurator --config firebase.json --non-interactive
